name: Build & Release Android APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Verify Architecture Graph (ADR-001)
        run: gradle verifyModuleDependencies --stacktrace

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK with Commit SHA
        run: |
          mkdir -p build-output
          cp app/build/outputs/apk/debug/app-debug.apk build-output/Snapfilters-v1.0.0-${GITHUB_SHA::7}.apk
          cp app/build/outputs/apk/debug/app-debug.apk build-output/Snapfilters-latest.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snapfilters-APK
          path: build-output/Snapfilters-*.apk
          retention-days: 90

      - name: Run Unit Tests
        continue-on-error: true
        run: gradle test --continue

      - name: Publish Nightly / Continuous GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: continuous-latest
          name: "Snapfilters Continuous Build (${{ github.sha }})"
          body: |
            ## Automated Continuous Build 📸
            **Commit:** `${{ github.sha }}`
            **Built at:** `${{ github.event.head_commit.timestamp }}`

            ### Download APK
            * Direct download: **[Snapfilters-latest.apk](https://github.com/${{ github.repository }}/releases/download/continuous-latest/Snapfilters-latest.apk)**

            ### Included Milestones
            * **Milestone 1:** 15-Module Gradle architecture, CameraX viewfinder, controls, capability probing (FR-CAM-01 to 09).
            * **Milestone 2:** 12 built-in cinematic filters, strict .cube parser (17/33/65), OpenGL ES 3.0 LUT shader, non-destructive export.
            * **Milestone 3:** External Sharesheet integration, FileProvider, distinct Photo vs Original sharing.
            * **Milestone 4:** Anonymous auth, 12-word recovery mnemonic, CSPRNG QR token redeem machine.
            * **Milestone 5:** 14-capability permission matrix, group audit logs, admin approval/rejection UI.
            * **Milestone 6:** Internal messaging, idempotent send, keyset pagination, unread timestamps.
            * **Milestone 7:** Live multi-face AR, Hungarian tracker, One Euro temporal smoothing, device tiering.
            * **Milestone 8:** Two-stage still-photo AR, sub-1.5% placement error, tiled bitmap compositor.
            * **Milestone 9:** NFR benchmarks, privacy plan, 6-step account deletion cascade.
          draft: false
          prerelease: true
          files: |
            build-output/Snapfilters-latest.apk
            build-output/Snapfilters-v1.0.0-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
